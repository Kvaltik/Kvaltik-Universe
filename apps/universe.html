const today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), nice=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
function defaultData(){return {version:1,notes:[],events:[],recent:[]}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.notes)&&Array.isArray(v.events))return v}catch(e){}return defaultData()}
let store=load(),page='home',noteEdit=null,search='',category='Vše';
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){toast('Úložiště prohlížeče je nedostupné. Doporučuji exportovat data.');return false}}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.remove('visible'),3200)}
function readPM(){try{return JSON.parse(localStorage.getItem(PMKEY)||'null')}catch(e){return null}}
function pmCount(){return readPM()?.projects?.length||7}
function upcoming(){return [...store.events].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4)}
function track(id){store.recent=[id,...store.recent.filter(x=>x!==id)].slice(0,7);save()}
function navigate(p){page=p;$$('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===p));let names={home:'Přehled',apps:'Aplikace',projects:'Project Manager',notes:'Nástěnka',calendar:'Kalendář',cloud:'Lokální úložiště',settings:'Nastavení'};$('#crumb').textContent='UNIVERSE / '+(names[p]||p).toUpperCase();render();window.scrollTo({top:0,behavior:'instant'})}
function card(m){return `<button class="module" data-open="${esc(m.id)}"><span class="module-head"><span class="module-emoji">${m.ico}</span><span class="tag ${m.live?'good':'wait'}">${m.live?'SPUSTIT':'V PLÁNU'}</span></span><span class="module-title">${esc(m.title)}</span><span class="module-desc">${esc(m.desc)}</span><span class="tiny muted">${esc(m.cat)} →</span></button>`}
function home(){let up=upcoming(), fav=['projects','notes','calendar','cloud','tsc','kvaltikhub'];return `<div class="hero"><div><div class="eyebrow">✦ ONE UNIVERSE. ALL PROJECTS.</div><h1>Vítej v <span>Kvaltík Universe.</span></h1><p>Jeden domov pro tvoje aplikace, nápady a projekty. Konečně nemusíme vymýšlet další aplikaci, abychom našli ty ostatní. 🤣</p><div class="buttons"><button class="btn primary" data-go="apps">▦ Otevřít aplikace</button><button class="btn" data-go="projects">📊 Správa projektů</button></div></div><div class="hero-art" aria-hidden="true"><div>🌌</div></div></div><div class="stats"><div class="stat"><div class="caption">Moduly v katalogu</div><div class="number">${modules.length}</div><div class="hint">Připravené k propojení</div></div><div class="stat"><div class="caption">Funkční moduly</div><div class="number">${modules.filter(m=>m.live).length}</div><div class="hint">Offline v tomto sestavení</div></div><div class="stat"><div class="caption">Projekty v PM</div><div class="number">${pmCount()}</div><div class="hint">Počítá se i základní sada</div></div><div class="stat"><div class="caption">Poznámky</div><div class="number">${store.notes.length}</div><div class="hint">V nástěnce</div></div></div><div class="content"><div class="panel"><div class="panel-header"><h2>Rychlý přístup</h2><button class="btn small" data-go="apps">Zobrazit vše →</button></div><div class="module-grid">${fav.map(i=>card(modules.find(m=>m.id===i))).join('')}</div></div><div class="panel"><div class="panel-header"><h2>📅 Nejbližší události</h2><button class="btn small" data-go="calendar">Kalendář</button></div>${up.length?up.map(e=>`<div class="item"><div><strong>${esc(e.title)}</strong><small>${nice(e.date)}</small></div><span class="pill">${esc(e.date)}</span></div>`).join(''):`<div class="empty">Zatím žádné události. Přidej si první do kalendáře. 📅</div>`}<div class="callout" style="margin-top:16px"><strong>☁️ Důležité:</strong> Tohle je první offline verze. Účet, serverový cloud, automatické aktualizace a synchronizaci teprve připravíme.</div></div></div>`}
function apps(){let cats=['Vše',...new Set(modules.map(x=>x.cat))];return `<div class="section-title"><div><h1>Všechny aplikace</h1><p>${modules.length} modulů na jednom místě. Funkční otevřeš hned, ostatní jsou v plánu.</p></div></div><div class="toolbar"><input id="app-search" type="search" placeholder="🔎 Hledat aplikaci…" value="${esc(search)}" aria-label="Hledat aplikace"><select id="cat-filter" aria-label="Filtrovat kategorii">${cats.map(x=>`<option ${x===category?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="module-grid" id="app-results"></div>`}
function drawAppResults(){let x=modules.filter(m=>(category==='Vše'||category===m.cat)&&`${m.title} ${m.desc} ${m.cat}`.toLocaleLowerCase('cs').includes(search.toLocaleLowerCase('cs')));$('#app-results').innerHTML=x.length?x.map(card).join(''):`<div class="empty full">Pro tento dotaz jsem žádnou aplikaci nenašel.</div>`}
function notes(){return `<div class="section-title"><div><h1>📌 Digitální nástěnka</h1><p>Osobní poznámky, úkoly a nápady. Ukládají se lokálně.</p></div></div><div class="panel"><h2 id="noteform-title">${noteEdit?'Upravit poznámku':'Nová poznámka'}</h2><form id="note-form" style="margin-top:15px" class="form-grid"><label>Název<input id="note-title" maxlength="100" placeholder="Co tě napadlo?" required></label><label>Barva<select id="note-color"><option value="green">🟢 Zelená</option><option value="blue">🔵 Modrá</option><option value="purple">🟣 Fialová</option><option value="orange">🟠 Oranžová</option></select></label><label class="wide">Obsah<textarea id="note-body" placeholder="Sem si napiš všechno důležité…" maxlength="5000"></textarea></label><div class="wide inline-actions"><button class="btn small ${noteEdit?'':'hide'}" type="button" data-act="note-cancel">Zrušit úpravu</button><button class="btn primary" type="submit">💾 Uložit poznámku</button></div></form></div><div class="note-list">${store.notes.length?store.notes.slice().reverse().map(n=>`<article class="note-card" style="border-top:3px solid ${{green:'#67efc6',blue:'#80b1ff',purple:'#df9df7',orange:'#fac379'}[n.color]||'#67efc6'}"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small class="muted">${new Date(n.updatedAt||Date.now()).toLocaleDateString('cs-CZ')}</small><div class="note-actions"><button class="btn small" data-act="edit-note" data-id="${esc(n.id)}">✏️ Upravit</button><button class="btn small danger" data-act="delete-note" data-id="${esc(n.id)}">Smazat</button></div></article>`).join(''):`<div class="empty full">Tvoje nástěnka je zatím prázdná. Připni první lísteček! 📝</div>`}</div>`}
function calendar(){let events=store.events.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="section-title"><div><h1>📅 Kalendář</h1><p>Udržuj přehled o důležitých událostech. Zatím bez systémových notifikací.</p></div></div><div class="panel"><h2>Přidat událost</h2><form id="event-form" class="form-grid" style="margin-top:16px"><label>Název události<input id="event-title" maxlength="110" placeholder="Třeba dokončit APK…" required></label><label>Datum<input id="event-date" type="date" value="${today()}" required></label><div class="wide inline-actions"><button class="btn primary" type="submit">+ Přidat do kalendáře</button></div></form></div><div class="panel" style="margin-top:16px"><h2>Moje události (${events.length})</h2><div style="margin-top:12px">${events.length?events.map(e=>`<div class="item"><div><strong>${esc(e.title)}</strong><small>${nice(e.date)}${e.date<today()?' · Uplynulo':''}</small></div><button class="btn small danger" data-act="delete-event" data-id="${esc(e.id)}">Smazat</button></div>`).join(''):`<div class="empty">Ještě tu nic nemáš. 🚀</div>`}</div></div>`}
function projects(){return `<div class="section-title"><div><h1>📊 Project Manager 2.0</h1><p>Celá naše nástěnka projektů, AI asistent a hřbitov — přímo uvnitř Universe.</p></div><button class="btn small" data-act="pm-pop">↗ Samostatné okno</button></div><div class="callout" style="margin-bottom:13px">✅ Tento modul skutečně obsahuje dříve vytvořený Project Manager 2.0. Data uložená v jiném prohlížeči je potřeba přenést přes export a import zálohy.</div><iframe class="projectframe" id="pm-frame" title="Kvaltík Project Manager 2.0" sandbox="allow-same-origin allow-scripts allow-forms allow-downloads allow-modals"></iframe>`}
function cloud(){return `<div class="section-title"><div><h1>☁️ Kvaltík Cloud Lite</h1><p>Soukromé lokální soubory; nejsou nahrané na žádný server.</p></div></div><div class="callout" style="margin-bottom:16px"><strong>🔒 Není to zatím internetový cloud.</strong> Soubory jsou uložené v tomto konkrétním prohlížeči a zařízení. Nejsou synchronizované, nesdílí se odkazem a při smazání dat prohlížeče se mohou ztratit. Důležité soubory si uchovávej i jinde.</div><div class="panel"><h2>Moje soubory</h2><div class="file-drop"><label for="local-upload" style="font-weight:700;display:block;margin-bottom:10px">📁 Přidat soubor do lokálního úložiště</label><input id="local-upload" type="file" multiple><div class="muted tiny" style="margin-top:7px">Doporučená velikost jednotlivého souboru do 10 MB. Kapacita závisí na prohlížeči.</div></div><div id="file-list"><div class="empty">Načítám soubory…</div></div></div>`}
function settings(){return `<div class="section-title"><div><h1>⚙️ Nastavení</h1><p>Zálohování dat a informace o této verzi.</p></div></div><div class="panel"><h2>💾 Zálohování</h2><p>Export zahrnuje poznámky, kalendář a data Project Manageru uložená v tomto prohlížeči. <strong>Nezahrnuje soubory</strong> z lokálního úložiště Cloud Lite.</p><div class="buttons"><button class="btn primary" data-act="export">⬇️ Exportovat JSON</button><button class="btn" data-act="import">⬆️ Importovat zálohu</button></div></div><div class="panel" style="margin-top:16px"><h2>🔗 Stav funkcí</h2><div class="item"><strong>Project Manager 2.0</strong><span class="tag good">ZAPOJENO</span></div><div class="item"><strong>Lokální poznámky a kalendář</strong><span class="tag good">FUNKČNÍ</span></div><div class="item"><strong>Cloud Lite v prohlížeči</strong><span class="tag good">FUNKČNÍ</span></div><div class="item"><strong>Účet, synchronizace PC ↔ mobil</strong><span class="tag wait">VE VÝVOJI</span></div><div class="item"><strong>Android APK / Windows EXE</strong><span class="tag wait">NESESTAVENO</span></div><div class="item"><strong>Automatické aktualizace</strong><span class="tag wait">PLÁN</span></div></div><div class="panel" style="margin-top:16px"><h2>O projektu</h2><p>Kvaltík Universe Alpha 0.1. Funkční offline prototyp spojující první nástroje a katalog dalších projektů. Přístup k jiným aplikacím není automaticky součástí této verze.</p></div>`}
function render(){let renderers={home,apps,projects,notes,calendar,cloud,settings};$('#app').innerHTML=(renderers[page]||home)();if(page==='apps')drawAppResults();if(page==='projects')loadPM();if(page==='cloud')renderFiles();if(page==='notes'&&noteEdit){let n=store.notes.find(x=>x.id===noteEdit);if(n){$('#note-title').value=n.title;$('#note-body').value=n.body;$('#note-color').value=n.color||'green'}}}
function pmHTML(){let t=$('#pm-payload').textContent.trim();let raw=atob(t);return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
function loadPM(){let f=$('#pm-frame');if(f)f.srcdoc=pmHTML()}
function openModule(id){let m=modules.find(x=>x.id===id);if(!m)return;track(id);if(m.live){navigate(id);return}$('#modtitle').textContent=m.ico+' '+m.title;$('#modcontent').innerHTML=`<p>${esc(m.desc)}</p><p><span class="tag wait">MODUL JE V PLÁNU</span></p><p>Zatím je v katalogu a čeká na zapojení. Můžeš ho rovnou zapsat do Project Manageru, ať nám nezapadne mezi dalších 40 nápadů. 😄</p><div class="inline-actions"><button class="btn" data-act="close-modal">Zavřít</button><button class="btn primary" data-act="plan-module" data-id="${esc(m.id)}">+ Přidat do projektů</button></div>`;$('#modal').classList.add('open')}
function planModule(id){let m=modules.find(x=>x.id===id);if(!m)return;let d=readPM()||{version:2,projects:[],ideas:[]};if(!Array.isArray(d.projects))d.projects=[];if(d.projects.some(p=>p.title?.toLocaleLowerCase('cs')===m.title.toLocaleLowerCase('cs'))){toast('Tento projekt už v Project Manageru máš.');closeModal();return}d.projects.push({id:uid(),title:m.title,description:m.desc,category:m.cat,status:'Nápad',priority:'Normální',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),tasks:[]});try{localStorage.setItem(PMKEY,JSON.stringify(d));toast('Přidáno do Project Manageru ✅');closeModal()}catch(e){toast('Projekt nejde uložit v tomto prohlížeči.')}}
function closeModal(){$('#modal').classList.remove('open')}
function saveNote(){let t=$('#note-title').value.trim(),b=$('#note-body').value.trim(),c=$('#note-color').value;if(!t)return;if(noteEdit){let n=store.notes.find(x=>x.id===noteEdit);if(n){Object.assign(n,{title:t,body:b,color:c,updatedAt:new Date().toISOString()})}}else store.notes.push({id:uid(),title:t,body:b,color:c,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});noteEdit=null;save();render();toast('Poznámka uložena ✅')}
function saveEvent(){let t=$('#event-title').value.trim(),d=$('#event-date').value;if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;store.events.push({id:uid(),title:t,date:d});save();render();toast('Událost přidána 📅')}
function download(name,blob){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportBackup(){const doc={format:'kvaltik-universe-backup',exportedAt:new Date().toISOString(),universe:store,projectManager:readPM()};download('Kvaltik-Universe-zaloha-'+today()+'.json',new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));toast('Záloha stažena (bez souborů z Cloud Lite).')}
async function importBackup(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.format!=='kvaltik-universe-backup'||!d.universe||!Array.isArray(d.universe.notes)||!Array.isArray(d.universe.events))throw new Error('Neplatný formát zálohy');if(!confirm('Opravdu přepsat stávající poznámky, kalendář a data Project Manageru touto zálohou?'))return;localStorage.setItem(KEY,JSON.stringify(d.universe));if(d.projectManager&&Array.isArray(d.projectManager.projects))localStorage.setItem(PMKEY,JSON.stringify(d.projectManager));store=load();navigate('home');toast('Záloha byla obnovena ✅')}catch(e){toast('Import selhal: '+e.message)}}
const DBNAME='kvaltik-universe-cloud-lite', DBVER=1;
function db(){return new Promise((res,rej)=>{if(!('indexedDB'in window))return rej(new Error('IndexedDB není dostupné'));let req=indexedDB.open(DBNAME,DBVER);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files',{keyPath:'id'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function allFiles(){let x=await db();return new Promise((res,rej)=>{let req=x.transaction('files','readonly').objectStore('files').getAll();req.onsuccess=()=>{x.close();res(req.result)};req.onerror=()=>{x.close();rej(req.error)}})}
async function addFile(file){let x=await db();return new Promise((res,rej)=>{let req=x.transaction('files','readwrite').objectStore('files').put({id:uid(),name:file.name,size:file.size,mime:file.type,uploadedAt:new Date().toISOString(),blob:file});req.onsuccess=()=>{x.close();res()};req.onerror=()=>{x.close();rej(req.error)}})}
async function getFile(id){let x=await db();return new Promise((res,rej)=>{let req=x.transaction('files','readonly').objectStore('files').get(id);req.onsuccess=()=>{x.close();res(req.result)};req.onerror=()=>{x.close();rej(req.error)}})}
async function delFile(id){let x=await db();return new Promise((res,rej)=>{let req=x.transaction('files','readwrite').objectStore('files').delete(id);req.onsuccess=()=>{x.close();res()};req.onerror=()=>{x.close();rej(req.error)}})}
function bytes(n){return n<1024?`${n} B`:n<1024*1024?`${(n/1024).toFixed(1)} KB`:`${(n/1024/1024).toFixed(1)} MB`}
async function renderFiles(){let el=$('#file-list');if(!el)return;try{let files=(await allFiles()).sort((a,b)=>b.uploadedAt.localeCompare(a.uploadedAt));if(page!=='cloud')return;el.innerHTML=files.length?`<div class="muted tiny" style="margin-bottom:8px">${files.length} souborů • ${bytes(files.reduce((a,b)=>a+b.size,0))} lokálně</div>${files.map(f=>`<div class="item"><div style="min-width:0"><strong style="overflow-wrap:anywhere">📄 ${esc(f.name)}</strong><small>${bytes(f.size)} · ${new Date(f.uploadedAt).toLocaleDateString('cs-CZ')}</small></div><div class="note-actions"><button class="btn small" data-act="download-file" data-id="${esc(f.id)}">⬇️</button><button class="btn small danger" data-act="delete-file" data-id="${esc(f.id)}">🗑️</button></div></div>`).join('')}`:`<div class="empty">Zatím nemáš žádné soubory. ☁️</div>`}catch(e){el.innerHTML=`<div class="empty">Lokální soubory nejsou dostupné v tomto prohlížeči.<br>${esc(e.message)}</div>`}}
async function uploadFiles(list){if(!list?.length)return;try{const existing=await allFiles();let size=existing.reduce((x,f)=>x+f.size,0);let accepted=0;for(const f of list){if(f.size>10*1024*1024){toast('Soubor '+f.name+' přesahuje limit 10 MB');continue}if(size+f.size>50*1024*1024){toast('Limit této ukázky je 50 MB souborů');break}await addFile(f);size+=f.size;accepted++}await renderFiles();if(accepted)toast('Uloženo '+accepted+' souborů ✅')}catch(e){toast('Uložení souboru selhalo: '+e.message)}}
function popPM(){let blob=new Blob([pmHTML()],{type:'text/html;charset=utf-8'});download('Kvaltik-Project-Manager-v2.0.html',blob);toast('Samostatný Project Manager stažen')}
function listen(){document.addEventListener('click',async e=>{let go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}let open=e.target.closest('[data-open]');if(open){openModule(open.dataset.open);return}let b=e.target.closest('[data-act]');if(!b)return;let id=b.dataset.id;switch(b.dataset.act){case 'close-modal':closeModal();break;case 'plan-module':planModule(id);break;case 'edit-note':noteEdit=id;render();$('#note-title')?.focus();break;case 'note-cancel':noteEdit=null;render();break;case 'delete-note':if(confirm('Smazat tuto poznámku?')){store.notes=store.notes.filter(x=>x.id!==id);save();render();toast('Poznámka smazána')}break;case 'delete-event':if(confirm('Smazat událost?')){store.events=store.events.filter(x=>x.id!==id);save();render();toast('Událost smazána')}break;case 'export':exportBackup();break;case 'import':$('#backup-input').click();break;case 'pm-pop':popPM();break;case 'download-file':try{let f=await getFile(id);if(f)download(f.name,f.blob)}catch(err){toast('Soubor nelze stáhnout')}break;case 'delete-file':if(confirm('Smazat tento lokálně uložený soubor?')){await delFile(id);await renderFiles();toast('Soubor smazán')}break;}}
);document.addEventListener('submit',e=>{if(e.target.id==='note-form'){e.preventDefault();saveNote()}if(e.target.id==='event-form'){e.preventDefault();saveEvent()}});document.addEventListener('input',e=>{if(e.target.id==='app-search'){search=e.target.value;drawAppResults()}});document.addEventListener('change',e=>{if(e.target.id==='cat-filter'){category=e.target.value;drawAppResults()}if(e.target.id==='local-upload'){uploadFiles(e.target.files)}if(e.target.id==='backup-input'){importBackup(e.target.files[0]);e.target.value=''}});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})}
listen();render();
})();
</script>
</body></html>
